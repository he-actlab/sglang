# B5-only correctness diagnostic. Supplemental CPU expected-state mirrors are
# NOT serving offload; native allocation/caps/state/graphs remain unchanged.
# DUMPER_ENABLE=false DUMPER_SERVER_PORT=reuse DUMPER_NON_INTRUSIVE_MODE=off
# DUMPER_SOURCE_PATCHER_CONFIG=<this file>. Never a performance measurement.
patches:
  - target: sglang.srt.debug_utils.dumper._Dumper.apply_source_patches
    edits:
      - match: config_path = self._config.source_patcher_config
        replacement: return
  - target: sglang.srt.model_executor.model_runner.ModelRunner.init_cuda_graphs
    preamble: |
      from sglang.srt.debug_utils.gdn_compact_shadow_b5 import initialize
      from sglang.srt.debug_utils.b5_native_block_observer import initialize as initialize_block
    edits:
      - match: self.eager_runner = EagerRunner(self)
        prepend: |
          initialize(self)
          initialize_block(self)
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2.forward_batch_generation
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow_b5 import worker_shadow
    edits:
      - match: batch_output.new_seq_lens = batch.seq_lens
        append: worker_shadow(self).prefill(batch)
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2._verify_block
    preamble: |
      from sglang.srt.debug_utils.gdn_compact_shadow_b5 import worker_shadow
      from sglang.srt.debug_utils.b5_native_block_observer import begin_verify, bind_locations, verification, result_owned, observed_append
    edits:
      - match: 'with spec_stage_span("verify"):'
        prepend: |
          begin_verify(batch, block, slot)
          bind_locations(slot, block)
          worker_shadow(self).begin(self.target_worker.model_runner.attn_backend.linear_attn_backend, batch, slot)
      - match: can_run_cuda_graph = target_out.can_run_cuda_graph
        append: worker_shadow(self).replay(can_run_cuda_graph)
      - match: 'if on_publish is not None:'
        prepend: verification(slot, candidates, target_predict, prefix_lens, commit_lens, bonus, out_tokens, new_seq_lens, logits_output.hidden_states, can_run_cuda_graph)
      - match: |
          if slot is not None:
              self._defer_draft_materialization(
        prepend: result_owned(result, slot)
      - match: self._append_target_hidden_to_draft_kv_by_loc(
        replacement: observed_append(self, self._append_target_hidden_to_draft_kv_by_loc,
      - match: return result
        prepend: worker_shadow(self).end()
  - target: sglang.srt.layers.attention.linear.gdn_backend.GDNAttnBackend.forward_extend
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import capture, output
    edits:
      - match: mixed_qkv_processed = causal_conv1d_update(
        prepend: self._native_dense_shadow.capture_conv(layer, mixed_qkv_reshaped, conv_states, cache_indices)
      - match: core_attn_out = self.kernel_dispatcher.target_verify(
        prepend: capture(self, layer, query, key, value, a, b, ssm_states, cache_indices, query_start_loc, retrieve_parent_token)
      - match: return core_attn_out
        prepend: |
          if is_target_verify:
              output(self, layer.layer_id, core_attn_out)
  - target: sglang.srt.layers.attention.hybrid_linear_attn_backend.HybridLinearAttnBackend.update_mamba_state_after_mtp_verify
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import check
    edits:
      - match: '# Track indices used for tracking mamba states for prefix cache'
        prepend: check(self.linear_attn_backend, last_correct_step_indices, mamba_track_indices, mamba_steps_to_track)
  - target: sglang.srt.managers.scheduler.Scheduler.get_internal_state
    preamble: |
      from sglang.srt.debug_utils.gdn_compact_shadow_b5 import snapshot
      from sglang.srt.debug_utils.b5_native_block_observer import snapshot as block_snapshot
    edits:
      - match: ret["effective_max_running_requests_per_dp"] = self.max_running_requests
        append: |
          ret["gdn_compact_shadow_b5"] = snapshot()
          ret["b5_native_block_observer"] = block_snapshot()
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2._draft_block
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import begin_draft, draft_graph
    edits:
      - match: bs = len(batch.seq_lens)
        prepend: begin_draft(self, batch, draft_input, own_outputs)
      - match: draft_out = self.draft_model_runner.forward(forward_batch)
        append: draft_graph(draft_out.can_run_graph)
  - target: sglang.srt.models.dflash.DFlashDraftModel.forward
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import graph_inputs
    edits:
      - match: hidden_states = input_embeds
        prepend: graph_inputs(self, input_ids, positions, input_embeds, forward_batch)
  - target: sglang.srt.speculative.dflash_worker_v2._DflashDraftSampler.__call__
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import observed_head
    edits:
      - match: 'self.out[: tokens.shape[0]].copy_(tokens)'
        append: observed_head(self, hidden_states)
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2._make_draft_block
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import own_block
    edits:
      - match: 'if own_outputs:'
        prepend: _b5_originals = (tokens, positions, cache_locs)
      - match: return SimpleNamespace(
        prepend: own_block(tokens, positions, cache_locs, own_outputs, _b5_originals)
  - target: sglang.srt.models.qwen3_5.Qwen3_5ForCausalLM.forward
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import capture_tap
    edits:
      - match: layer = self.layers[layer_idx]
        append: capture_tap(layer_idx, hidden_states, residual, forward_batch)
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2._defer_draft_materialization
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import deferred
    edits:
      - match: verify_done = dev.Event()
        prepend: deferred(slot, hidden, materialize)
  - target: sglang.srt.speculative.dflash_worker_v2.DFlashWorkerV2.flush_spec_pdmux_pending
    preamble: from sglang.srt.debug_utils.b5_native_block_observer import observed_append, finish_append
    edits:
      - match: self._append_target_hidden_to_draft_kv_by_loc(**pending.materialize)
        replacement: observed_append(self, self._append_target_hidden_to_draft_kv_by_loc, **pending.materialize)
      - match: pending.on_relay(pending.relay_result)
        append: finish_append(index)
