# Test-only: DUMPER_ENABLE=false DUMPER_SERVER_PORT=reuse
# DUMPER_NON_INTRUSIVE_MODE=off DUMPER_SOURCE_PATCHER_CONFIG=<this file>
# No tensor dumps; no performance claims. All matches must be unique.
patches:
  # Target and draft load_model each request patches. Install exactly once:
  # the first invocation continues in its original, already executing frame.
  - target: sglang.srt.debug_utils.dumper._Dumper.apply_source_patches
    edits:
      - match: config_path = self._config.source_patcher_config
        replacement: return
  - target: sglang.srt.model_executor.model_runner.ModelRunner.init_cuda_graphs
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import initialize
    edits:
      - match: self.eager_runner = EagerRunner(self)
        prepend: initialize(self)
  - target: sglang.srt.layers.attention.linear.gdn_backend.GDNAttnBackend.forward_extend
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import capture, output
    edits:
      - match: core_attn_out = self.kernel_dispatcher.target_verify(
        prepend: capture(self, layer, query, key, value, a, b, ssm_states, cache_indices, query_start_loc, retrieve_parent_token)
      - match: return core_attn_out
        prepend: |
          if is_target_verify:
              output(self, layer.layer_id, core_attn_out)
  - target: sglang.srt.layers.attention.hybrid_linear_attn_backend.HybridLinearAttnBackend.update_mamba_state_after_mtp_verify
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import check
    edits:
      - match: "# Track indices used for tracking mamba states for prefix cache"
        prepend: check(self.linear_attn_backend, last_correct_step_indices, mamba_track_indices, mamba_steps_to_track)
  - target: sglang.srt.managers.scheduler.Scheduler.get_internal_state
    preamble: from sglang.srt.debug_utils.gdn_compact_shadow import snapshot
    edits:
      - match: ret["effective_max_running_requests_per_dp"] = self.max_running_requests
        append: ret["gdn_compact_shadow"] = snapshot()
