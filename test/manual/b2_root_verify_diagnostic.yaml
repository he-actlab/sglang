# Opt-in correctness-only source fixture; no normal runner enables this.
# DUMPER_ENABLE=false DUMPER_SERVER_PORT=reuse DUMPER_NON_INTRUSIVE_MODE=off
# SGLANG_B2_ROOT_VERIFY_DIAGNOSTIC_KIND=correctness-only
# SGLANG_B2_ROOT_VERIFY_DIAGNOSTIC_CONFIG=<exact frozen request catalog>
patches:
  - target: sglang.srt.debug_utils.dumper._Dumper.apply_source_patches
    edits:
      - match: config_path = self._config.source_patcher_config
        replacement: return
  - target: sglang.srt.model_executor.model_runner.ModelRunner.init_cuda_graphs
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import initialize
    edits:
      - match: self.eager_runner = EagerRunner(self)
        prepend: initialize(self)
  - target: sglang.srt.managers.tp_worker.TpModelWorker.forward_batch_generation
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import capture_prefill
    edits:
      - match: |
          if not forward_batch.is_prefill_only:
              # For normal requests, sample the next token ids.
              batch_result.next_token_ids = self.model_runner.sample(
                  logits_output, forward_batch
              )
        replacement: |
          if not forward_batch.is_prefill_only:
              # For normal requests, sample the next token ids.
              batch_result.next_token_ids = self.model_runner.sample(
                  logits_output, forward_batch
              )
              capture_prefill(self, batch, forward_batch, batch_result, is_verify)
  - target: sglang.srt.speculative.eagle_worker_v2.EAGLEWorkerV2.verify
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import capture_verify, capture_compact, attach_result
    edits:
      - match: new_seq_lens = batch.seq_lens + accept_lens
        prepend: |
          diagnostic_capture = capture_verify(self, batch, verify_forward_batch, verify_input, logits_output, predict, accept_lens, accept_index, can_run_cuda_graph)
      - match: next_draft_input = EagleDraftInput(bonus_tokens=bonus_tokens)
        prepend: capture_compact(diagnostic_capture, predict)
      - match: |
          return GenerationBatchResult(
              logits_output=logits_output,
              next_token_ids=predict,
              can_run_cuda_graph=can_run_cuda_graph,
              speculative_num_draft_tokens=self.speculative_num_draft_tokens,
              next_draft_input=next_draft_input,
              accept_lens=accept_lens,
              new_seq_lens=new_seq_lens,
              routed_experts_output=forward_batch_output.routed_experts_output,
              indexer_topk_output=forward_batch_output.indexer_topk_output,
              extra_keep_alive_refs=[verify_forward_batch],
          )
        replacement: |
          return attach_result(GenerationBatchResult(
              logits_output=logits_output,
              next_token_ids=predict,
              can_run_cuda_graph=can_run_cuda_graph,
              speculative_num_draft_tokens=self.speculative_num_draft_tokens,
              next_draft_input=next_draft_input,
              accept_lens=accept_lens,
              new_seq_lens=new_seq_lens,
              routed_experts_output=forward_batch_output.routed_experts_output,
              indexer_topk_output=forward_batch_output.indexer_topk_output,
              extra_keep_alive_refs=[verify_forward_batch],
          ), diagnostic_capture)
  - target: sglang.srt.managers.scheduler_components.batch_result_processor.SchedulerBatchResultProcessor.process_batch_result_prefill
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import publish
    edits:
      - match: req.output_ids.append(next_token_id)
        append: publish(req, [next_token_id], result, "prefill")
  - target: sglang.srt.managers.scheduler_components.batch_result_processor.SchedulerBatchResultProcessor.process_batch_result_decode
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import publish
    edits:
      - match: req.output_ids.extend(next_token_id)
        append: publish(req, next_token_id, result, "verify")
  - target: sglang.srt.managers.scheduler.Scheduler.get_internal_state
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import snapshot
    edits:
      - match: ret["effective_max_running_requests_per_dp"] = self.max_running_requests
        append: ret["b2_root_verify_diagnostic"] = snapshot()
  - target: sglang.srt.speculative.eagle_utils.eagle_sample
    preamble: from sglang.srt.debug_utils.b2_root_verify_diagnostic import capture_native_argmax
    edits:
      - match: target_predict = target_predict.reshape(bs, verify_input.draft_token_num)
        append: capture_native_argmax(verify_input, batch, target_predict)

